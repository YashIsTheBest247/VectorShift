services:

  backend:
    build:
      context: ./vectorshift-backend
    container_name: vectorshift-backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./vectorshift-frontend
    container_name: vectorshift-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped